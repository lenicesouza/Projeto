<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Tarefas, rotina e finanças pessoais em um só lugar.">
  <title>Meu Dia</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="view-title">Hoje</h1>
    <span id="today-label" class="muted"></span>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Seções">
    <button type="button" data-view="today"><span aria-hidden="true">☀️</span>Hoje</button>
    <button type="button" data-view="tasks"><span aria-hidden="true">✅</span>Tarefas</button>
    <button type="button" data-view="routine"><span aria-hidden="true">🔁</span>Rotina</button>
    <button type="button" data-view="finance"><span aria-hidden="true">💰</span>Finanças</button>
    <button type="button" data-view="more"><span aria-hidden="true">⚙️</span>Mais</button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
